<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nguyen Pham Nhat Anh - Backend Developer">
  <defs>
    <style>
      @font-face { font-family: "AntonS"; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "JBMS"; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "InterS"; src: url(data:font/woff2;base64,) format("woff2"); }
      .display { font-family: "AntonS", Impact, "Arial Narrow Bold", sans-serif; font-size: 84px; }
      .mono { font-family: "JBMS", ui-monospace, Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 2.4px; }
      .tag { font-family: "InterS", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 600; }
      .up1 { transform: translateY(100px); animation: up .9s cubic-bezier(.2,.8,.2,1) .25s forwards; }
      .up2 { transform: translateY(100px); animation: up .9s cubic-bezier(.2,.8,.2,1) .5s forwards; }
      .f0 { opacity: 0; animation: fade .7s ease-out .05s forwards; }
      .f1 { opacity: 0; animation: fade .8s ease-out 1.15s forwards; }
      .f2 { opacity: 0; animation: fade .8s ease-out 1.45s forwards; }
      .bar { transform: scaleY(0); transform-box: fill-box; transform-origin: top; animation: grow .6s ease-out 1.0s forwards; }
      .slab { transform: translateX(260px); opacity: 0; animation: slide 1.1s cubic-bezier(.2,.8,.2,1) .35s forwards; }
      .dot { animation: pulse 2.6s ease-in-out 2s infinite; }
      @keyframes up { to { transform: translateY(0); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes grow { to { transform: scaleY(1); } }
      @keyframes slide { to { transform: translateX(0); opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    </style>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="20"/></clipPath>
    <clipPath id="l1"><rect x="40" y="70" width="560" height="86"/></clipPath>
    <clipPath id="l2"><rect x="40" y="156" width="560" height="90"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#F5F0E8"/>
    <!-- slanted accent slab, echoing the portfolio -->
    <g class="slab">
      <polygon points="1062,300 1098,150 1200,136 1200,300" fill="#C8341F"/>
      <polygon points="1136,300 1158,214 1200,208 1200,300" fill="#8F2312" opacity=".55"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#16181F" stroke-opacity=".12"/>

  <!-- top labels -->
  <text x="56" y="50" class="mono f0" fill="#6B6A68"><tspan fill="#16181F">NHATANH-DEV</tspan> <tspan fill="#C8341F">·</tspan> BACKEND DEVELOPER</text>
  <text x="1144" y="50" text-anchor="end" class="mono f0" fill="#6B6A68">HO CHI MINH CITY, VN</text>

  <!-- name -->
  <g clip-path="url(#l1)"><text x="52" y="150" class="display up1" fill="#16181F">NGUYEN PHAM</text></g>
  <g clip-path="url(#l2)">
    <g class="up2">
      <g transform="translate(56,236) skewX(-11)">
        <text x="0" y="0" class="display" fill="#C8341F">NHAT ANH</text>
        <text x="302" y="0" class="display dot" fill="#C8341F">.</text>
      </g>
    </g>
  </g>

  <!-- tagline -->
  <rect x="640" y="132" width="4" height="62" fill="#C8341F" class="bar"/>
  <text x="662" y="157" class="tag f1" fill="#16181F">Building reliable systems</text>
  <text x="662" y="187" class="tag f1" fill="#16181F">that solve real-world problems.</text>

  <!-- focus chips -->
  <text x="642" y="236" class="mono f2" fill="#6B6A68">.NET   PAYMENTS   REAL-TIME   CONCURRENCY</text>
</svg>
